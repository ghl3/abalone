# Medium run — the first configuration meant to actually learn something.
#
# Twelve generations at full search depth. Run this only after
# config/validation.yaml has passed its four acceptance criteria; scaling up a
# run whose training signal is empty just buys more empty data.
#
# Success looks like (MODEL.md §8.2): >= +100 Elo per 10 generations against
# frozen checkpoints with intervals that exclude zero, games *lengthening*
# toward 120-200 plies while natural termination stays high, and
# captures_per_100_plies falling. Read it with
# `uv run python -m model.report --run latest`.
seed: 0
gens: 12
runs_root: runs
web_export_path: web/public/models/best.onnx
# 10×128, ~3.0M params.
net_preset: base
use_coreml: true

self_play:
  # 400. MODEL.md §9's estimate for this was ~10 min a generation; the measured
  # figure on `ruby-panther` is **~38-46 min** at a steady 22.2 positions/s
  # through CoreML, and self-play is the dominant cost of a generation rather
  # than a fraction of the ladder's. Distinct positions are still what the step
  # budget below is divided by — and distinct *games* are what the per-game
  # value and score heads get, which is the tighter constraint of the two
  # (docs/NOTEBOOK.md, 2026-07-29).
  games_per_gen: 400
  shard_games_per_file: 2
  worker_threads: null   # null = (cores - 1)
  # Playout cap randomisation (MODEL.md §7.2): most moves run the fast budget,
  # a quarter run the full one, and only those produce policy targets. Roughly
  # 2–3× more games per unit compute at equal target quality.
  sims_fast: 200
  sims_full: 800
  full_search_rate: 0.25
  c_puct: 1.4
  batch_size: 32
  virtual_loss: 1.0
  fpu_reduction: 0.25
  dirichlet_alpha: 0.2
  dirichlet_eps: 0.25
  temperature_plies: 30
  temperature: 1.0
  opening: belgian
  # Initial rate only; the live one is annealed and lives in state.json.
  handicap_rate: 0.7
  handicap_max: 5
  handicap_anneal:
    # See standard.yaml for why the signal is natural termination of unseeded
    # games rather than the decisive rate (MODEL.md §4). 200 games/gen at 0.7
    # leaves ~60 unseeded, so the controller has a sample to act on from gen 1.
    mode: controller
    target_natural_termination: 0.25
    step: 0.05
    # Proportional: step x clamp(signal/target, 1, 4). A saturated signal
    # retires the curriculum in three generations rather than twelve.
    max_step_multiple: 4.0
    floor: 0.10
    min_unseeded_games: 20
    schedule: {}
  # 5, not 2 — every game otherwise starts from the same Belgian Daisy, and
  # distinct *games* are what the per-game value and score heads learn from.
  # Free. See standard.yaml for the full argument.
  random_opening_plies: 5
  # 300, not 200. At the cap the game is adjudicated on the sign of the marble
  # differential, so a one-marble edge becomes a full ±1 value label; that was
  # 17% of `ruby-panther`'s generation-24 games and rising. See standard.yaml.
  max_plies: 300
  no_progress_plies: 0
  capture_gamma: 0.98

train:
  # The arithmetic:
  #
  #   400 games x ~150 plies      = ~60k positions per generation
  #   replay_buffer_gens: 8       => the window tops out near 480k positions
  #   1.5 epochs over  60k        = 1.5 *  60000 / 256 =  352 steps
  #   1.5 epochs over 480k        = 1.5 * 480000 / 256 = 2812 steps
  #
  # so steps_per_gen_min binds for the first two generations (400 steps over a
  # 60k buffer is 1.7 epochs) and the epoch target binds thereafter, still not
  # approaching steps_per_gen_max. The ply figure is measured — `ruby-panther`
  # reached 130 plies by generation 24 under a 200 cap, and `max_plies: 300`
  # lets the tail run further. The old 4000-step cap over an early 60k buffer
  # would have been 17 raw epochs in one generation.
  # Self-play is CPU-bound and training is GPU-bound, so these steps run on
  # wall-clock that would otherwise be idle — but idle wall-clock is not a
  # reason to make twenty passes over the same positions.
  steps_per_gen_min: 400
  steps_per_gen_max: 4000
  target_epochs_per_gen: 1.5
  epochs_per_gen_warn: 8.0
  batch_size: 256
  learning_rate: 1.0e-3
  # Step decay keyed to generation milestones (MODEL.md §8).
  lr_schedule:
    8: 3.0e-4
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 1.0
  loss_weights:
    value: 1.0
    score: 0.15
    capture_map: 0.15
  ema:
    enabled: true
    decay: 0.999
    warmup_steps: 200
  replay_buffer_gens: 8
  replay_buffer_min_size: 5000
  symmetry_augment: true
  poll_interval_ms: 250

validation:
  enabled: true
  # The frozen ruler: comparable end to end, and a drift indicator only.
  holdout_gen: 1
  every_gens: 1
  positions: 8192
  # How much of gen 1 is actually withheld, satisfied by whole games. Matching
  # `positions` is the most that can ever be scored in a pass; more would be
  # data thrown away for nothing. This run measured gen 1 at 57,699 positions —
  # the largest generation, since games are longest under random play — so the
  # old whole-generation holdout cost ~50k trainable positions AND emptied the
  # pool outside gen 2, which silently skipped the rolling holdout.
  holdout_positions: 8192
  batch_size: 512
  seed: 20260727
  entropy_ratio_warn: 0.95
  overfit_warn_delta: 0.35
  rolling:
    # The set worth gating on: 10% of every generation's own games, withheld
    # from that generation's training and never sampled again.
    enabled: true
    every_gens: 1
    fraction: 0.10
    positions: 8192

anchor_ladder:
  # Every generation. The old every-4 cadence was priced when `eval-match` was
  # missing self-play's fixed-batch padding and a rung cost several times the
  # same games in self-play. Post-fix, `ruby-panther`'s gen-8 ladder played 128
  # games in 5.4 min.
  every_gens: 1
  run_on_final_gen: true
  # 64, not 32: a 32-game rung resolves about ±120 Elo, and `ruby-panther` was
  # down to ~35 Elo/generation by generation 24. This panel is 3 × 64 + 2 × 16 =
  # 224 games, ~20 min against ~46 min of self-play. See standard.yaml.
  games: 64
  floor_games: 16
  simulations: 200
  # Floor anchors only — a sanity check, not a milestone. `heuristic@800` is
  # retired (MODEL.md §8.2): its evaluator cannot tell one capture of margin
  # from four, and a 1.1M network beat it after 180 games.
  opponents: [random, heuristic@100]
  # Deliberately empty: an absolute generation can name a checkpoint that will
  # never exist, and it breaks extending a finished run. See standard.yaml.
  frozen_gens: []
  # The gauntlet, and the whole measurement — `gen - k` improves as fast as the
  # network does, so it never saturates the way a fixed anchor must. Offsets
  # from measured resolution; see standard.yaml for both tables.
  #
  # `1` is dropped: over `ruby-panther`'s generations 13–24 it returned ten
  # readings from −66 to +124 with every interval spanning zero. Unlike
  # standard.yaml this stops at 8 rather than 16 — a twelve-generation run
  # never reaches a generation where `gen − 16` names a checkpoint, and a rung
  # that resolves to nothing is silently dropped rather than reported.
  trailing_gens: [2, 4, 8]
  batch_size: 32
  c_puct: 1.4
  opening: belgian
  # Match self-play; it also decorrelates games within a rung.
  random_opening_plies: 5
  temperature_plies: 10
  temperature: 1.0
  # Match self-play, or a rung adjudicates positions the training distribution
  # resolves properly.
  max_plies: 300
  no_progress_plies: 0
  threads: null

export:
  games_per_gen: 30
  web_export: true

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 15
  keep_last_shard_gens: 12
  keep_last_game_gens: 12
