# Medium run — the first configuration meant to actually learn something.
#
# Twelve generations at full search depth. Run this only after
# config/validation.yaml has passed its four acceptance criteria; scaling up a
# run whose training signal is empty just buys more empty data.
#
# Success looks like: decisive rate > 40%, mean plies < 180, policy target
# entropy well below ln(branching), value CE falling on the holdout, and a
# ladder Elo curve that goes up.
seed: 0
gens: 12
runs_root: runs
web_export_path: web/public/models/best.onnx
# 10×128, ~3.0M params.
net_preset: base
use_coreml: true

self_play:
  games_per_gen: 200
  shard_games_per_file: 2
  worker_threads: null   # null = (cores - 1)
  # Playout cap randomisation (MODEL.md §7.2): most moves run the fast budget,
  # a quarter run the full one, and only those produce policy targets. Roughly
  # 2–3× more games per unit compute at equal target quality.
  sims_fast: 200
  sims_full: 800
  full_search_rate: 0.25
  c_puct: 1.4
  batch_size: 32
  virtual_loss: 1.0
  fpu_reduction: 0.25
  dirichlet_alpha: 0.2
  dirichlet_eps: 0.25
  temperature_plies: 30
  temperature: 1.0
  opening: belgian
  # Initial rate only; the live one is annealed and lives in state.json.
  handicap_rate: 0.7
  handicap_max: 5
  handicap_anneal:
    # See standard.yaml for why the signal is natural termination of unseeded
    # games rather than the decisive rate (MODEL.md §4). 200 games/gen at 0.7
    # leaves ~60 unseeded, so the controller has a sample to act on from gen 1.
    mode: controller
    target_natural_termination: 0.25
    step: 0.05
    floor: 0.10
    min_unseeded_games: 20
    schedule: {}
  random_opening_plies: 2
  max_plies: 200
  no_progress_plies: 0
  capture_gamma: 0.98

train:
  steps_per_gen_min: 1000
  # Self-play is CPU-bound and training is GPU-bound, so the extra steps run on
  # wall-clock that would otherwise be idle. The cap stops a fixed buffer being
  # oversampled into overfitting.
  steps_per_gen_max: 4000
  batch_size: 256
  learning_rate: 1.0e-3
  # Step decay keyed to generation milestones (MODEL.md §8).
  lr_schedule:
    8: 3.0e-4
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 1.0
  loss_weights:
    value: 1.0
    score: 0.15
    capture_map: 0.15
  ema:
    enabled: true
    decay: 0.999
    warmup_steps: 200
  replay_buffer_gens: 8
  replay_buffer_min_size: 5000
  symmetry_augment: true
  poll_interval_ms: 250

validation:
  enabled: true
  holdout_gen: 1
  every_gens: 1
  positions: 8192
  batch_size: 512
  seed: 20260727
  entropy_ratio_warn: 0.95

anchor_ladder:
  every_gens: 3
  run_on_final_gen: true
  games: 24
  simulations: 400
  # `heuristic@800` at equal simulation count is the milestone (MODEL.md §8.2).
  opponents: [random, heuristic@100, heuristic@800]
  frozen_gens: [1, 6]
  batch_size: 32
  c_puct: 1.4
  opening: belgian
  random_opening_plies: 2
  temperature_plies: 10
  temperature: 1.0
  max_plies: 200
  no_progress_plies: 0
  threads: null

export:
  games_per_gen: 30
  web_export: true

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 15
  keep_last_shard_gens: 12
  keep_last_game_gens: 12
