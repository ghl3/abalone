# Dry-run / smoke-test config. Tiny settings for fast end-to-end
# verification of the full pipeline. Whole loop runs in ~1 minute.
seed: 0
gens: 2
runs_root: runs
web_export_path: web/public/models/best.onnx

self_play:
  games_per_gen: 4
  shard_games_per_file: 2
  simulations_per_move: 20
  c_puct: 1.4
  temperature_plies: 4
  temperature: 1.0
  dirichlet_alpha: 0.3
  dirichlet_eps: 0.25
  worker_threads: 2

train:
  steps_per_gen: 10
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  value_loss_weight: 0.5
  value_target_blend_start: 0.5
  value_target_blend_end: 1.0
  value_target_blend_done_by_gen: 2
  replay_buffer_gens: 2
  replay_buffer_min_size: 1
  symmetry_augment: true
  poll_interval_ms: 100

eval:
  gate_every_gens: 1
  gate_games: 2
  gate_simulations: 20
  gate_threshold: 0.5
  heuristic_every_gens: 1
  heuristic_games: 2
  heuristic_simulations: 20
  random_every_gens: 1
  random_games: 2

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 25
  keep_last_shard_gens: 25
  web_export_on_promotion: true
