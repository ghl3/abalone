# Dry-run / smoke-test config.
#
# Purpose: prove the whole pipeline runs end to end — self-play writes shards,
# training consumes them, ONNX exports from the EMA weights, games export to
# JSON, held-out validation scores, the anchor ladder plays. It is far too
# small to learn anything; do not read the numbers as evidence about the model.
#
# Three generations is the minimum that exercises everything: gen 1 produces the
# frozen holdout (bounded — most of gen 1 stays trainable), gen 2 validates
# against it, takes the first rolling holdout and plays gen 1 as a frozen ladder
# rung, gen 3 is the first with a distinct trailing rung and the first to evict
# a generation around its frozen slice.
# Target wall-clock: a few minutes.
seed: 0
gens: 3
runs_root: runs
# Run-scoped on purpose. A dry run's network has seen six games and must never
# land on the path the web app loads — `{run_id}` is interpolated at export.
web_export_path: runs/{run_id}/web/best.onnx
# 6×96. The dry run measures plumbing, not capacity.
net_preset: small
# CoreML compiles one model per input shape, per thread. At this size the
# compile dominates the run; the 30× throughput win needs a real workload.
use_coreml: false

self_play:
  games_per_gen: 6
  shard_games_per_file: 2
  worker_threads: 4
  # Tiny budgets. `full_search_rate: 0.5` so a 6-game run still produces
  # enough policy-target rows for the entropy diagnostic to mean something.
  sims_fast: 16
  sims_full: 32
  full_search_rate: 0.5
  c_puct: 1.4
  batch_size: 8
  virtual_loss: 1.0
  fpu_reduction: 0.25
  dirichlet_alpha: 0.2
  dirichlet_eps: 0.25
  temperature_plies: 10
  temperature: 1.0
  # Belgian Daisy starts in contact and is far livelier than the standard
  # layout; combined with near-certain handicap seeding, games terminate fast.
  opening: belgian
  handicap_rate: 0.9
  handicap_max: 5
  handicap_anneal:
    # Six games a generation: the controller can never reach
    # min_unseeded_games and will hold every generation. That is what the dry
    # run is checking — that the measurement, the decision and the log line all
    # happen, not that the rate moves.
    mode: controller
    target_natural_termination: 0.25
    step: 0.05
    max_step_multiple: 4.0
    floor: 0.10
    min_unseeded_games: 20
    schedule: {}
  random_opening_plies: 2
  # 60, not the real 200. Note what this does to the health line: most games
  # reach the cap and are adjudicated on capture differential, so `mean_plies`
  # here reads ~60 by construction and is not a measurement of anything. The
  # decisive rate and the policy entropy ratio still are.
  max_plies: 60
  no_progress_plies: 0
  capture_gamma: 0.98

train:
  steps_per_gen_min: 20
  steps_per_gen_max: 40
  # 6 games x ~50 plies is ~300 positions/gen, so 40 steps x batch 32 = 1280
  # samples is ~4 passes over a two-generation buffer. The epoch target is set
  # anyway so the code path is exercised; steps_per_gen_min is what binds here.
  target_epochs_per_gen: 2.0
  epochs_per_gen_warn: 8.0
  batch_size: 32
  learning_rate: 1.0e-3
  lr_schedule: {}
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 1.0
  loss_weights:
    value: 1.0
    score: 0.15
    capture_map: 0.15
  ema:
    enabled: true
    decay: 0.99
    warmup_steps: 5
  replay_buffer_gens: 2
  replay_buffer_min_size: 1
  symmetry_augment: true
  poll_interval_ms: 100

validation:
  enabled: true
  holdout_gen: 1
  every_gens: 1
  positions: 512
  # Deliberately far below a generation's ~300 positions, so the dry run
  # actually exercises the bound: gen 1 gives up ~3 of its 6 games and keeps
  # the rest as training data. Left at null (= `positions`) it would swallow
  # the whole generation at this scale, which is the bug this knob exists to
  # prevent — and gen 2's rolling holdout would be skipped for want of a pool.
  holdout_positions: 96
  batch_size: 128
  seed: 20260727
  entropy_ratio_warn: 0.95
  overfit_warn_delta: 0.35
  rolling:
    enabled: true
    every_gens: 1
    # A large fraction because the generation is tiny: 20% of 6 games rounds up
    # to two whole games, which is the smallest slice that is a slice at all.
    # Fires from gen 2 now that the frozen holdout leaves gen 1's remainder in
    # the trainable pool.
    fraction: 0.2
    positions: 256

anchor_ladder:
  every_gens: 1
  run_on_final_gen: true
  games: 6
  floor_games: 4
  simulations: 24
  opponents: [random, heuristic@24]
  frozen_gens: [1]
  # gen - 1: at gen 2 this resolves onto gen 1 and is deduplicated against
  # frozen_gens; at gen 3 it is gen 2 and is a distinct rung. Exercising the
  # dedup is half the point of having it here.
  trailing_gens: [1]
  batch_size: 8
  c_puct: 1.4
  opening: belgian
  random_opening_plies: 2
  temperature_plies: 6
  temperature: 1.0
  max_plies: 60
  no_progress_plies: 0
  threads: 4

export:
  games_per_gen: null   # all of them; there are only six
  web_export: true

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 25
  keep_last_shard_gens: 25
  keep_last_game_gens: 25
