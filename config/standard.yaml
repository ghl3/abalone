# Standard run — the real one. 50 generations.
#
# Budget, measured on run `ruby-panther` rather than estimated. Self-play holds
# **22.2 positions/s** on an M1 Pro through CoreML — steady to three
# significant figures across generations 20–23, each position costing
# playout-cap-randomised 200/800 sims. At 400 games and the ~150 plies the
# higher ply cap below allows, that is ~60k positions, so **~46 min of
# self-play per generation**. The anchor ladder adds ~26 min (see its own
# note), training overlaps self-play and is free. Call it **~72 min a
# generation, ~60 hours end to end** — up from ~40 h, because both the ply cap
# and the ladder were deliberately made more expensive.
#
# `use_coreml: true` is not optional: the CPU path is over an order of
# magnitude slower.
#
# Before starting one, check `runs/` is excluded from Spotlight. Indexing the
# shard tree cost about 1.6 cores continuously on the previous run and grew as
# it went; there is a `.metadata_never_index` marker but System Settings →
# Spotlight → Search Privacy is the reliable version.
#
# The milestones are in MODEL.md §8.2: sustained >= +100 Elo per 10 generations
# against frozen checkpoints with intervals excluding zero, and games
# *lengthening* toward 120-200 plies with captures_per_100_plies falling while
# natural termination stays high. `ruby-panther` hit non-random play by gen 2-3
# and ran at ~85 Elo/generation over 12 generations, so the bar above is a
# floor, not a target. Read a run back with
# `uv run python -m model.report --run latest`.
seed: 0
gens: 50
runs_root: runs
web_export_path: web/public/models/best.onnx
# 10×128, ~3.0M params. `large` (14×192) is the option if throughput allows.
net_preset: base
use_coreml: true

self_play:
  # 400. §9 budgets 200 games at ~10M evaluations, ~5 min a generation batched,
  # so 400 is ~10 min — under a third of one anchor ladder. Doubling games is
  # the cheapest way to buy distinct positions, and distinct positions are what
  # the step budget below is divided by.
  games_per_gen: 400
  shard_games_per_file: 4
  worker_threads: null   # null = (cores - 1)
  sims_fast: 200
  sims_full: 800
  full_search_rate: 0.25
  c_puct: 1.4
  batch_size: 32
  virtual_loss: 1.0
  fpu_reduction: 0.25
  dirichlet_alpha: 0.2
  dirichlet_eps: 0.25
  temperature_plies: 30
  temperature: 1.0
  opening: belgian
  # MODEL.md §4. The initial value only — the live rate is annealed down and
  # persisted in state.json, so this stays inside config_hash and a resume is
  # still refused if somebody edits it.
  handicap_rate: 0.7
  handicap_max: 5
  handicap_anneal:
    # Closed loop on the *natural termination rate of unseeded games* — the
    # fraction of handicap-(0,0) games that reach six captures before the ply
    # cap. Not the decisive rate: with adjudication, uniformly random play is
    # already 63% decisive and 0% naturally terminating, so a decisive-rate
    # threshold pulls the curriculum in generation one.
    mode: controller
    target_natural_termination: 0.25
    step: 0.05
    # The step is proportional to signal/target, capped at 4x. A fixed step
    # ignores the size of its own error signal: the validation run measured the
    # signal at 4x target for three consecutive generations and still moved
    # 0.05 each time.
    max_step_multiple: 4.0
    # A permanent 10% trickle: 5–4 capture positions are strategically critical
    # and essentially never visited by self-play from a fresh start.
    floor: 0.10
    # 400 games/gen at rate 0.7 leaves ~120 unseeded — comfortably above this,
    # and the margin only grows as the rate falls. `ruby-panther` measured
    # 351-368 unseeded games per generation once the rate reached its floor.
    min_unseeded_games: 20
    schedule: {}
  # 5, not 2. Every game starts from the same Belgian Daisy, so these plies are
  # the only source of positional diversity outside the handicap trickle — and
  # the value head's effective sample size is the *game* count, not the position
  # count. `ruby-panther` began memorising per-game labels at generation 22 with
  # 3,200 distinct games in its buffer (docs/NOTEBOOK.md, 2026-07-29). Wider
  # openings buy distinct games at zero compute cost, which makes this the only
  # free item on that list.
  random_opening_plies: 5
  # 300, not 200. At the cap `Game::adjudicate` decides on the *sign* of the
  # marble differential, so a one-marble edge at ply 200 becomes a full ±1 value
  # label. That was 17% of `ruby-panther`'s generation-24 games and the fraction
  # grew every generation as defence improved: natural termination fell
  # 0.94 → 0.83 while games lengthened 112 → 130 plies. A higher cap converts
  # part of that into real six-capture wins. It costs only the tail of the
  # distribution, and nothing downstream needs to know — plane 12 is
  # `ply / max_plies` read from the game's own cap, not a constant.
  max_plies: 300
  no_progress_plies: 0
  capture_gamma: 0.98

train:
  # The arithmetic:
  #
  #   400 games x ~150 plies   = ~60k positions per generation
  #   replay_buffer_gens: 20   => the window tops out near 1.2M positions
  #   1.5 epochs over  60k     = 1.5 *   60000 / 256 =  352 steps
  #   1.5 epochs over 1.2M     = 1.5 * 1200000 / 256 = 7031 steps
  #
  # so steps_per_gen_min binds while the window fills (500 steps over a 60k
  # buffer is 2.1 epochs) and the epoch target takes over from about
  # generation 2. Each position is therefore seen ~1.5 times per generation for
  # the 20 generations it lives in the buffer — ~30 times in total, against the
  # ~120 the old fixed cap implied.
  #
  # The ply figure is measured, not assumed: `ruby-panther` reached 130 plies by
  # generation 24 under a 200 cap, and `max_plies: 300` above lets the tail run
  # further. The old comment here said 100 plies and sized the cap from it,
  # which is why `steps_per_gen_max` moves with it — at 5000 the *cap* would
  # bind at 1.07 epochs instead of the epoch target, silently retuning the
  # training regime. It is outside `config_hash`, so it can be retuned mid-run
  # if the measured ply count lands somewhere else.
  steps_per_gen_min: 500
  steps_per_gen_max: 8000
  target_epochs_per_gen: 1.5
  epochs_per_gen_warn: 8.0
  batch_size: 256
  learning_rate: 1.0e-3
  # Step decay keyed to generation milestones. A constant LR for fifty
  # generations leaves strength on the table (MODEL.md §8).
  lr_schedule:
    20: 3.0e-4
    35: 1.0e-4
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 1.0
  loss_weights:
    value: 1.0
    score: 0.15
    capture_map: 0.15
  ema:
    enabled: true
    decay: 0.999
    warmup_steps: 500
  replay_buffer_gens: 20
  replay_buffer_min_size: 10000
  symmetry_augment: true
  poll_interval_ms: 250

validation:
  enabled: true
  # The frozen ruler. Comparable for fifty generations, and by generation 50 a
  # measure of drift away from generation 1 rather than of generalisation.
  holdout_gen: 1
  every_gens: 1
  positions: 8192
  # Positions withheld from gen 1, by whole game. Bounded on purpose: a
  # validation pass draws `positions` rows, so withholding more is training data
  # given up for nothing — and withholding the whole generation also empties the
  # pool outside gen 2 and skips the rolling holdout below.
  holdout_positions: 8192
  batch_size: 512
  seed: 20260727
  entropy_ratio_warn: 0.95
  overfit_warn_delta: 0.35
  rolling:
    # The set worth gating on. 10% of each generation's own games, withheld
    # from that generation's training and never sampled again — same
    # distribution as the training data, provably never seen, so the gap
    # between val_rolling loss and training loss is memorisation and nothing
    # else. Costs a tenth of the data.
    enabled: true
    every_gens: 1
    fraction: 0.10
    positions: 8192

anchor_ladder:
  # Every generation. Cost is no longer the constraint it was: `eval-match` was
  # missing the fixed-batch padding that self-play already had, so CoreML
  # recompiled per input shape and a rung took ~186 s per 9-game wave. With that
  # fixed, `ruby-panther`'s generation-8 ladder played 128 games across 5 rungs
  # in **5.4 minutes**. This panel is ~152 games, so ~6.5 min a generation
  # against ~45 min of self-play — about 12% overhead for a measurement every
  # generation instead of every fifth.
  every_gens: 1
  run_on_final_gen: true
  # 64, not 32. A 32-game rung resolves about ±120 Elo, and by generation 24
  # `ruby-panther` was gaining ~35 Elo a generation — so the near rungs spent
  # ten consecutive ladders reporting noise, including a −100 against `gen − 4`
  # from a network that was in fact improving. 64 games narrows the interval by
  # ~√2; the honest fix for the nearest rungs is to stop playing them, which is
  # what `trailing_gens` below now does.
  #
  # Cost, measured on `ruby-panther`'s generation-24 ladder: a 32-game rung at
  # ~135 mean plies took 2.6–2.9 min. This panel is 4 × 64 + 2 × 12 = 280 games,
  # ~26 min with the higher ply cap, against ~60 min of self-play. That is ~30%
  # overhead where the old panel was ~12% — bought deliberately. A measurement
  # that cannot resolve the effect it is measuring is not cheap, it is free and
  # worthless.
  games: 64
  floor_games: 12
  simulations: 200
  # Floor anchors: losing to these is a bug, beating them is not a result.
  # `random` is swept from about generation 3 and stays swept — it is kept
  # anyway because it costs ~30 s and it is the check that catches a
  # catastrophic regression instantly. `heuristic@100` has actual positional
  # judgement and stays meaningful longer. `heuristic@800` is retired as a
  # milestone and as a rung (MODEL.md §8.2).
  opponents: [random, heuristic@100]
  # **Deliberately empty.** An absolute generation number can name a checkpoint
  # that will never exist — `[1, 25]` in a 12-generation run — which is a bug
  # this project hit twice. It also breaks the workflow of extending a finished
  # run by a few generations, since the "fixed" reference is fixed to a run
  # length that just changed. Everything a frozen anchor was for is better
  # served by an offset, which cannot name a nonexistent generation.
  frozen_gens: []
  # The gauntlet, and the whole measurement. `gen − k` improves as fast as the
  # network does, so unlike a fixed anchor it never saturates: a flat 0.75
  # against `gen − 4` generation after generation means the learning rate is
  # holding, and a drift toward 0.50 means it has stalled. That is a more
  # direct read on "is more training helping" than any rating number, and it
  # needs no cross-generation state at all.
  #
  # The spread is picked from measured resolution, not taste, and it has now
  # been re-picked once. At ~85 Elo/generation over `ruby-panther`'s first
  # twelve generations, 32 games per rung
  # (docs/2026-07-28-first-strength-measurement.md):
  #
  #   1 generation back   +55  [-63, +188]   does NOT resolve — CI spans zero
  #   2 generations back  +177 [ +59, +353]  marginal
  #   4 generations back  +364 [+227, +720]  resolves cleanly
  #   6 generations back  +470 [+306, +720]  resolves, pressing the ceiling
  #   8+ generations back                    swept 32-0-0, reports a bound
  #
  # That comment predicted the useful rung would *move* as per-generation gains
  # shrank, and generations 13–24 confirmed it (docs/NOTEBOOK.md, 2026-07-29).
  # At ~35–55 Elo/generation the same panel measured:
  #
  #   1 generation back   ten readings spanning -66 to +124, every CI spanning
  #                       zero — a rung that produced nothing for ten ladders
  #   2 generations back  -77 to +137, resolves about a third of the time
  #   4 generations back  +215 mean, sd 105 — the workhorse
  #   8 generations back  +525 → +279 mean as gains shrank; still the widest
  #                       resolving rung, and the first to escape the bound
  #
  # So `1` is dropped: it is not a cheap insurance rung, it is 64 games spent to
  # learn nothing, and it will only get worse as the run goes on. `16` replaces
  # it at the far end, for the same reason `8` was worth keeping when it was
  # still reporting a bound — it is the rung that will still resolve at
  # generation 50 when `2` has gone quiet. `retention.keep_last_onnx` must cover
  # the deepest offset; `RunConfig.validate` enforces that.
  trailing_gens: [2, 4, 8, 16]
  batch_size: 32
  c_puct: 1.4
  opening: belgian
  # Match self-play. More opening spread also decorrelates the games *within* a
  # rung, which is exactly what a 64-game match needs to earn its extra games.
  random_opening_plies: 5
  temperature_plies: 10
  temperature: 1.0
  # Match self-play, so a rung measures the game the network is trained on. A
  # ladder capped at 200 while self-play runs to 300 would adjudicate a class of
  # positions the training distribution resolves properly.
  max_plies: 300
  no_progress_plies: 0
  threads: null

export:
  games_per_gen: 40
  web_export: true

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 25
  keep_last_shard_gens: 25
  keep_last_game_gens: 25
