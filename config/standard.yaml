# Standard run — the real one. 50 generations.
#
# Budget (MODEL.md §9): 200 games × ~150 plies × playout-cap-randomised
# 200/800 sims is ~10M network evaluations per generation. Batched leaf
# evaluation plus CoreML is what makes that a few minutes rather than an hour,
# so `use_coreml: true` is not optional here.
#
# Expect the first genuinely non-random play around gen 10, and the milestone —
# beating heuristic@800 at equal simulation count — somewhere past gen 30, if
# it comes at all.
seed: 0
gens: 50
runs_root: runs
web_export_path: web/public/models/best.onnx
# 10×128, ~3.0M params. `large` (14×192) is the option if throughput allows.
net_preset: base
use_coreml: true

self_play:
  games_per_gen: 200
  shard_games_per_file: 4
  worker_threads: null   # null = (cores - 1)
  sims_fast: 200
  sims_full: 800
  full_search_rate: 0.25
  c_puct: 1.4
  batch_size: 32
  virtual_loss: 1.0
  fpu_reduction: 0.25
  dirichlet_alpha: 0.2
  dirichlet_eps: 0.25
  temperature_plies: 30
  temperature: 1.0
  opening: belgian
  # MODEL.md §4: start at ~70% seeded and anneal toward 0–20% as the natural
  # decisive rate rises. There is no schedule for this yet — retune by hand
  # between runs once the decisive rate from unseeded games is worth reading.
  handicap_rate: 0.7
  handicap_max: 5
  random_opening_plies: 2
  max_plies: 200
  no_progress_plies: 0
  capture_gamma: 0.98

train:
  steps_per_gen_min: 1000
  steps_per_gen_max: 5000
  batch_size: 256
  learning_rate: 1.0e-3
  # Step decay keyed to generation milestones. A constant LR for fifty
  # generations leaves strength on the table (MODEL.md §8).
  lr_schedule:
    20: 3.0e-4
    35: 1.0e-4
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 1.0
  loss_weights:
    value: 1.0
    score: 0.15
    capture_map: 0.15
  ema:
    enabled: true
    decay: 0.999
    warmup_steps: 500
  replay_buffer_gens: 20
  replay_buffer_min_size: 10000
  symmetry_augment: true
  poll_interval_ms: 250

validation:
  enabled: true
  holdout_gen: 1
  every_gens: 1
  positions: 8192
  batch_size: 512
  seed: 20260727
  entropy_ratio_warn: 0.95

anchor_ladder:
  every_gens: 5
  run_on_final_gen: true
  games: 40
  simulations: 400
  opponents: [random, heuristic@100, heuristic@800]
  # Frozen earlier checkpoints: "am I beating my past self" is the other half
  # of the ladder, and it is the one that catches a silent regression.
  frozen_gens: [1, 10, 25]
  batch_size: 32
  c_puct: 1.4
  opening: belgian
  random_opening_plies: 2
  temperature_plies: 10
  temperature: 1.0
  max_plies: 200
  no_progress_plies: 0
  threads: null

export:
  games_per_gen: 40
  web_export: true

retention:
  keep_last_checkpoints: 5
  keep_last_onnx: 25
  keep_last_shard_gens: 25
  keep_last_game_gens: 25
