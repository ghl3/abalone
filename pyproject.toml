[project]
name = "abalone"
version = "0.1.0"
description = "AlphaZero-style training pipeline for Abalone (model + training loop)"
requires-python = ">=3.12,<3.13"
authors = [{ name = "George Lewis" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "onnxscript>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
# We don't actually build a wheel — `model/` is consumed via `uv run`.
# Setting hatchling here to satisfy uv's parser without committing to a
# real build backend.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["target", "web", "crates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
