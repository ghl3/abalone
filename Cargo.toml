[workspace]
resolver = "2"
members = ["crates/game", "crates/mcts", "crates/selfplay", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["George Lewis"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
