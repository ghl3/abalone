[package]
name = "abalone-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
abalone-game = { path = "../game" }
abalone-mcts = { path = "../mcts" }
abalone-encoder = { path = "../encoder" }
wasm-bindgen = "0.2"

# `rand`/`getrandom` need explicit JS-bridge support to compile for the
# wasm32-unknown-unknown target. Nothing here calls into JS-side entropy —
# `abalone-mcts` seeds its `SmallRng` from the caller's seed — but without
# this feature the build fails at link time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
