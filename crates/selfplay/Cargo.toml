[package]
name = "abalone-selfplay"
version.workspace = true
edition.workspace = true
authors.workspace = true
autobenches = false

[lib]
name = "abalone_selfplay"
path = "src/lib.rs"

[dependencies]
abalone-game = { path = "../game" }
abalone-mcts = { path = "../mcts" }
rand = { version = "0.8", features = ["small_rng"] }
# Arrow IPC + Parquet for shard files. Picked over a hand-rolled binary
# format because (a) pyarrow gives Python zero-copy numpy reads, (b)
# columnar layout + snappy compresses our low-entropy bitboards 2-5x,
# (c) schema evolution is documented.
arrow = "55"
parquet = { version = "55", features = ["arrow"] }

[[bin]]
name = "selfplay-stub"
path = "src/bin/selfplay_stub.rs"

[lints]
workspace = true
